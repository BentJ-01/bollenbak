<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bieravond Scouts Vosselaar</title>
  <meta name="description" content="Het digitale bierboekje van de bieravond van Scouts Vosselaar — meer dan 60 bieren." />
  <meta name="theme-color" content="#2a1a10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #c4161c;
      --blue: #1d6fb8;
      --green: #2e9b3a;
      --gold: #e6b325;
      --ink: #1f1a17;
      --muted: #6b5f55;
      --paper: #fffdf8;
      --wood: #3a2414;
      --bar-h: 56px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(120% 80% at 50% 0%, #4a2e1a 0%, #24160d 60%, #160d07 100%);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    /* ---------- Top & bottom bars ---------- */
    .topbar, .bottombar {
      position: fixed; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; height: var(--bar-h); color: #f5e7cf;
    }
    .topbar { top: 0; padding-top: env(safe-area-inset-top); height: calc(var(--bar-h) + env(safe-area-inset-top)); }
    .bottombar { bottom: 0; padding-bottom: env(safe-area-inset-bottom); height: calc(var(--bar-h) + env(safe-area-inset-bottom)); justify-content: center; }
    .brand { font-family: Oswald, sans-serif; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 18px; }
    .brand small { display: block; font-family: "Source Sans 3", sans-serif; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12px; opacity: .7; margin-top: -2px; }
    .spacer { flex: 1; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,.1); display: grid; place-items: center;
      transition: background .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.18); }
    .icon-btn:disabled { opacity: .3; cursor: default; }
    .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .search-btn { width: auto; border-radius: 22px; padding: 0 16px 0 12px; display: flex; gap: 8px; align-items: center; }
    .pager { min-width: 92px; text-align: center; font-family: Oswald, sans-serif; font-size: 15px; letter-spacing: .05em; }
    .progress { position: absolute; left: 16px; right: 16px; top: 0; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
    .progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s; }

    /* ---------- Book ---------- */
    .book {
      position: fixed; left: 0; right: 0;
      top: calc(var(--bar-h) + env(safe-area-inset-top));
      bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
      display: grid; place-items: center; padding: 8px 16px 12px 22px;
      touch-action: pan-y; z-index: 1;
    }
    /* Scrollable page content is its own touch scope, so it needs pan-y too: otherwise the
       browser claims horizontal swipes there and the page never turns. */
    .book, .book * { touch-action: pan-y; }
    .book { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .book img { -webkit-user-drag: none; user-select: none; }
    .book.dragging { cursor: grabbing; }
    .stack { position: relative; width: 100%; max-width: 440px; height: 100%; max-height: 820px; perspective: 2200px; }
    /* the unread rest of the booklet, peeking out at the right and bottom */
    .edges {
      position: absolute; inset: 0; z-index: 0; border-radius: 6px 14px 14px 6px; background: #efe6d6;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    .page { position: absolute; inset: 0; display: none; transform-origin: left center; transform-style: preserve-3d; }
    .page.on { display: block; }
    .sheet, .back {
      position: absolute; inset: 0; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .sheet {
      border-radius: 6px 14px 14px 6px; background: var(--paper);
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    /* reverse side of a page while it is being turned */
    .back {
      transform: rotateY(180deg); border-radius: 14px 6px 6px 14px;
      pointer-events: none; /* otherwise this hidden face swallows taps and scrolling on the page */
      background: linear-gradient(270deg, rgba(0,0,0,.16), transparent 22px), linear-gradient(90deg, #f3ebdc, var(--paper) 70%);
    }
    /* booklet spine */
    .sheet::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 18px; z-index: 3; pointer-events: none;
      background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,.06) 45%, transparent);
    }
    /* lighting while turning (real elements so only opacity changes per frame) */
    .shade {
      position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; will-change: opacity;
      background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.12) 55%, rgba(0,0,0,.04));
    }
    .back .shade { background: linear-gradient(270deg, rgba(0,0,0,.45), rgba(0,0,0,.1) 70%); }
    .page.on { will-change: transform; }
    .page.idle { visibility: hidden; }
    /* shadow the lifted page casts on the page underneath */
    .cast {
      position: absolute; top: 0; bottom: 0; left: 0; width: 70px; z-index: 2; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.38), transparent); will-change: transform, opacity;
    }

    /* ---------- Beer page ---------- */
    .beer .sheet { display: flex; flex-direction: column; }
    .beer .scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 22px 22px 0 30px; }
    .beer h2 {
      font-family: Oswald, sans-serif; font-weight: 600; text-transform: uppercase;
      font-size: clamp(26px, 7.5vw, 34px); line-height: 1.02; margin: 0 0 10px; color: var(--red);
    }
    .beer.nonalc h2 { color: var(--blue); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag {
      font-family: Oswald, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 3px; color: #fff; background: var(--green);
    }
    .tag.trap { background: #4a2d1e; }
    .tag.na { background: var(--blue); }
    .tekst { margin: 0; font-size: 15.5px; line-height: 1.45; color: #2c2622; }
    /* glow + wooden table travel with the bottle, whatever the text length */
    .stage {
      position: relative; flex: 1 0 340px; margin: 10px -22px 0 -30px;
      background:
        linear-gradient(180deg, var(--paper) 0%, #fff3c4 30%, #f3c95a 58%, transparent 58.1%),
        repeating-linear-gradient(178deg, rgba(0,0,0,.08) 0 2px, transparent 2px 9px),
        linear-gradient(180deg, #6b4022 58%, #4a2b16 80%, #2d1a0d 100%);
    }
    /* bottle fills the free space between the text and the ABV bar */
    .stage img {
      position: absolute; z-index: 1; left: 50%; transform: translateX(-50%);
      bottom: 60px; height: calc(100% - 64px); width: auto; max-width: 70%; object-fit: contain; object-position: bottom;
      filter: drop-shadow(10px 14px 10px rgba(0,0,0,.45));
    }
    .nr {
      position: absolute; left: 30px; bottom: 76px; z-index: 2;
      width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid #fff;
      display: grid; place-items: center; color: #fff;
      font-family: Oswald, sans-serif; font-weight: 700; font-size: 19px;
      background: rgba(0,0,0,.25);
    }
    .abv {
      position: absolute; left: 30px; right: 22%; bottom: 18px; z-index: 2;
      font-family: Oswald, sans-serif; font-weight: 600; font-size: 22px; color: #1f1a17;
      padding: 4px 14px; background: linear-gradient(90deg, var(--gold), #f3d36b 60%, rgba(243,211,107,0));
    }
    .abv small { font-weight: 500; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; margin-left: 8px; }

    /* ---------- Cover / back / wine / contents ---------- */
    .back .sheet { background: #2a1a10; display: flex; flex-direction: column; }
    .back .art { flex: 1; }
    .back .art { background-position: center; background-size: contain; background-repeat: no-repeat; background-color: #3a2414; }
    /* cover: the flyer's layers re-arranged for a portrait page */
    .cover .sheet {
      container-type: size;
      background: #3b2213 url(img/cover/bg.webp) 74% 100% / cover no-repeat;
    }
    .cv-top { position: absolute; left: 0; right: 0; top: 0; padding: 7cqh 7cqw 0 9cqw; text-align: right; z-index: 3; }
    .cv-date { margin: 0; color: #fff; font-weight: 700; font-size: clamp(17px, 6.4cqw, 28px); letter-spacing: .01em; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
    .cv-title { display: block; width: 100%; margin: 1.2cqh 0 1.6cqh; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
    .cv-badge {
      display: inline-block; background: #d2232a; color: #fff; font-weight: 700; font-size: clamp(15px, 5.4cqw, 24px);
      padding: .18em .6em; border-radius: 3px; box-shadow: 0 6px 14px rgba(0,0,0,.35);
    }
    .cv-photo { position: absolute; z-index: 1; right: 4cqw; top: 33cqh; width: 64cqw; filter: drop-shadow(6px 10px 12px rgba(0,0,0,.45)); }
    .cv-glass { position: absolute; z-index: 2; left: 5cqw; bottom: 13cqh; height: 50cqh; filter: drop-shadow(14px 18px 14px rgba(0,0,0,.35)); }
    .cv-logo { position: absolute; z-index: 2; right: 7cqw; bottom: 15cqh; width: 38cqw; filter: drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
    .cv-foot {
      position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 12cqh 7cqw 3.2cqh 9cqw; color: #f5e7cf;
      background: linear-gradient(180deg, transparent, rgba(20,11,5,.75) 55%);
    }
    .cv-foot p { margin: 0; font-size: 15px; opacity: .85; }
    .cv-foot .hint { margin-top: 6px; }
    .hint { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--gold); animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(6px); } }

    .plain .scroll { height: 100%; overflow-y: auto; padding: 26px 22px 26px 34px; }
    .plain h2 { font-family: Oswald, sans-serif; text-transform: uppercase; font-size: 30px; margin: 0 0 4px; color: var(--red); }
    .plain .sub { color: var(--muted); margin: 0 0 18px; }
    .toc { list-style: none; padding: 0; margin: 0; columns: 2; column-gap: 16px; }
    .toc li { break-inside: avoid; }
    .toc button {
      width: 100%; text-align: left; border: 0; background: none; padding: 5px 0;
      display: flex; gap: 8px; align-items: baseline; font-size: 14.5px; line-height: 1.2;
    }
    .toc button:hover span:last-child { color: var(--red); }
    .toc .n { font-family: Oswald, sans-serif; font-weight: 600; color: var(--muted); min-width: 22px; }
    .toc .na { color: var(--blue); }

    .wine .sheet { background: linear-gradient(180deg, var(--paper) 0%, #fbf3e3 100%); }
    .wine h2 { color: #8a1538; }
    .wine h3 { font-family: Oswald, sans-serif; font-weight: 600; text-transform: uppercase; color: #b8860b; font-size: 24px; line-height: 1.05; margin: 22px 0 8px; }
    .wine .glass { width: 120px; margin: 26px auto 0; display: block; opacity: .9; }

    /* ---------- Search sheet ---------- */
    .search {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      background: rgba(22,13,7,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .search.open { opacity: 1; pointer-events: auto; }
    .panel {
      margin: calc(10px + env(safe-area-inset-top)) auto 0; width: calc(100% - 20px); max-width: 520px;
      max-height: calc(100% - 20px - env(safe-area-inset-top)); display: flex; flex-direction: column;
      background: var(--paper); border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      transform: translateY(-12px); transition: transform .2s;
    }
    .search.open .panel { transform: none; }
    .field { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-bottom: 1px solid #eee3d3; }
    .field svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
    .field input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 17px; color: var(--ink); min-width: 0; }
    .field .close { border: 0; background: #f1e8da; border-radius: 18px; padding: 7px 12px; font-size: 14px; }
    .chips { flex: none; display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #eee3d3; }
    .chip {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid #d9cab2; background: #fff; color: var(--ink); border-radius: 16px; padding: 6px 12px; font-size: 14px; line-height: 1.1;
    }
    .chip .x { display: none; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.22); place-items: center; font-size: 10px; line-height: 1; }
    .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); padding-right: 6px; }
    .chip[aria-pressed="true"] .x { display: inline-grid; }
    .toc-page .chips { padding: 0 0 14px; border: 0; flex-wrap: wrap; }
    .toc li[hidden] { display: none; }
    .toc .wn { min-width: 22px; }
    .toc-empty { color: var(--muted); font-size: 14.5px; }
    .toc-btn { position: absolute; left: 16px; top: 50%; translate: 0 calc(-50% - env(safe-area-inset-bottom) / 2); width: 40px; height: 40px; }
    .toc-btn svg { width: 20px; height: 20px; }
    .results { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; }
    .results button {
      width: 100%; border: 0; background: none; text-align: left; padding: 8px 16px;
      display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
    }
    .results button:hover, .results button:focus-visible { background: #f6efe3; outline: 0; }
    .results img { width: 34px; height: 52px; object-fit: contain; }
    .results .ph { width: 34px; height: 52px; display: grid; place-items: center; font-size: 22px; }
    .results strong { display: block; font-weight: 600; font-size: 16px; }
    .results .meta { font-size: 13px; color: var(--muted); }
    .results .pct { font-family: Oswald, sans-serif; font-weight: 600; color: var(--ink); }
    .results mark { background: #ffe58a; color: inherit; border-radius: 2px; }
    .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      .hint { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Bieravond<small>Scouts Vosselaar · 7 &amp; 8 november 2026</small></div>
    <div class="spacer"></div>
    <button class="icon-btn search-btn" id="openSearch" aria-label="Zoek een bier">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Zoeken
    </button>
  </header>

  <main class="book" id="book"><div class="stack" id="stack" aria-live="polite"><div class="edges" id="edges"></div><div class="cast" id="cast"></div></div></main>

  <nav class="bottombar">
    <div class="progress"><i id="progress"></i></div>
    <button class="icon-btn toc-btn" id="tocBtn" aria-label="Naar de inhoud" title="Inhoud"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></button>
    <button class="icon-btn" id="prev" aria-label="Vorige pagina"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="pager" id="pager">1 / 1</div>
    <button class="icon-btn" id="next" aria-label="Volgende pagina"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </nav>

  <div class="search" id="search" role="dialog" aria-modal="true" aria-label="Zoeken">
    <div class="panel">
      <div class="field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Naam, nummer of smaak…" autocomplete="off" enterkeyhint="search" />
        <button class="close" id="closeSearch">Sluiten</button>
      </div>
      <div class="chips" data-chips></div>
      <ul class="results" id="results"></ul>
    </div>
  </div>

  <script src="bieren.js"></script>
  <script>
    const book = document.getElementById('book');
    const stack = document.getElementById('stack');
    const items = window.BIEREN;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'");
    const img = b => `img/bieren/${String(b.nr).padStart(2, '0')}.webp`;
    const abvNum = b => parseFloat(String(b.abv || '0').replace(',', '.'));
    const isNonAlc = b => b.type === 'alcoholvrij';
    const glassSvg = `<svg class="glass" viewBox="0 0 100 160" aria-hidden="true"><path d="M22 8h56c2 30-6 52-28 56C28 60 20 38 22 8Z" fill="#f1d36a" stroke="#8a6d1a" stroke-width="3"/><path d="M22 8h56l-1 14H23Z" fill="#fff" opacity=".7"/><path d="M50 64v70M30 150h40" stroke="#8a6d1a" stroke-width="4" stroke-linecap="round"/></svg>`;

    // ---------- Build pages ----------
    const pages = []; // { el, key }
    const pageOf = {}; // item nr -> page index
    function addPage(cls, html, key) {
      const el = document.createElement('section');
      el.className = 'page ' + cls;
      el.innerHTML = `<div class="sheet">${html}<i class="shade"></i></div><div class="back"><i class="shade"></i></div>`;
      stack.appendChild(el);
      pages.push({ el, key });
      return pages.length - 1;
    }

    addPage('cover', `
      <div class="cv-top">
        <p class="cv-date">7 &amp; 8 november 2026</p>
        <img class="cv-title" src="img/cover/title.webp" alt="Bieravond" />
        <span class="cv-badge">Proef meer dan 60 bieren</span>
      </div>
      <img class="cv-photo" src="img/cover/photo.webp" alt="" />
      <img class="cv-glass" src="img/cover/glass.webp" alt="" />
      <img class="cv-logo" src="img/cover/logo.webp" alt="Bieren geleverd door 't Klaverblad" />
      <div class="cv-foot">
        <p>${items.filter(b => b.type !== 'wijn').length} bieren · ${items.filter(isNonAlc).length} alcoholvrij · 2 wijnen</p>
        <div class="hint">Swipe of tik om te bladeren →</div>
      </div>`, 'cover');

    const tocIdx = addPage('plain toc-page', `<div class="scroll">
      <h2>Inhoud</h2><p class="sub">Tik op een bier om ernaartoe te bladeren.</p>
      <div class="chips" data-chips></div>
      <ul class="toc" id="toc"></ul><p class="toc-empty" id="tocEmpty" hidden>Niets gevonden.</p></div>`, 'inhoud');

    let wineDone = false;
    for (const b of items) {
      if (b.type === 'wijn') {
        if (wineDone) continue;
        wineDone = true;
        const wines = items.filter(w => w.type === 'wijn');
        const i = addPage('plain wine', `<div class="scroll">
          <h2>Ook te proeven</h2><p class="sub">Liever een glaasje wijn?</p>
          ${wines.map(w => `<h3>${esc(w.naam)}</h3><p class="tekst">${esc(w.tekst)}</p>`).join('')}
          ${glassSvg}</div>`, 'wijn');
        wines.forEach(w => pageOf[w.nr] = i);
        continue;
      }
      const tags = [
        b.vat && `<span class="tag">Van 't vat</span>`,
        b.trappist && `<span class="tag trap">Trappist</span>`,
        isNonAlc(b) && `<span class="tag na">Alcoholvrij</span>`,
      ].filter(Boolean).join('');
      pageOf[b.nr] = addPage('beer' + (isNonAlc(b) ? ' nonalc' : ''), `
        <div class="scroll">
          <h2>${esc(b.naam)}</h2>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
          <p class="tekst">${esc(b.tekst)}</p>
          <div class="stage">
            <img src="${img(b)}" alt="${esc(b.naam)}" decoding="async" />
            <div class="nr">${b.nr}</div>
            <div class="abv">${esc(b.abv)}<small>alc.</small></div>
          </div>
        </div>`, String(b.nr));
    }

    addPage('back', `<div class="art" style="background-image:url(img/klaverblad.webp)" role="img" aria-label="Bieren geleverd door Drankenhandel 't Klaverblad, Beerse"></div>`, 'klaverblad');

    document.getElementById('toc').innerHTML = items.map(b => {
      const n = b.type === 'wijn' ? '<span class="n wn">🍷</span>' : `<span class="n ${isNonAlc(b) ? 'na' : ''}">${b.nr}</span>`;
      return `<li data-nr="${b.nr}"><button data-go="${pageOf[b.nr]}">${n}<span>${esc(b.naam)}</span></button></li>`;
    }).join('');

    // ---------- Navigation: pages turn around the spine like a real booklet ----------
    const pager = document.getElementById('pager');
    const progress = document.getElementById('progress');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const tocBtn = document.getElementById('tocBtn');
    const edges = document.getElementById('edges');
    const cast = document.getElementById('cast');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const frontShade = el => el.firstElementChild.lastElementChild;
    const backShade = el => el.lastElementChild.firstElementChild;
    let current = 0;
    let flip = null; // { top, under, dest, fwd, theta, raf }

    function label(i) {
      const k = pages[i].key;
      if (k === 'cover') return 'Cover';
      if (k === 'inhoud') return 'Inhoud';
      if (k === 'wijn') return 'Wijn';
      if (k === 'klaverblad') return 'Einde';
      return `Nr. ${k} / ${items.filter(b => b.type !== 'wijn').length}`;
    }

    // At rest: the current page lies flat on top, its neighbours are already rendered underneath
    // (hidden), so a turn can start on the very first frame without layout work.
    function settle(i) {
      if (flip) cancelAnimationFrame(flip.raf);
      flip = null;
      const changed = i !== current;
      current = i;
      pages.forEach((p, k) => {
        const near = Math.abs(k - i) <= 1;
        p.el.classList.toggle('on', near);
        p.el.classList.toggle('idle', near && k !== i);
        p.el.style.zIndex = k === i ? 2 : 1;
        p.el.style.transform = k < i ? 'rotateY(-180deg)' : '';
        frontShade(p.el).style.opacity = 0;
        backShade(p.el).style.opacity = 0;
      });
      cast.style.opacity = 0;

      const k = pages[i].key;
      if (changed || location.hash) history.replaceState(null, '', k === 'cover' ? location.pathname : '#' + k);
      pager.textContent = label(i);
      progress.style.width = (i / (pages.length - 1) * 100) + '%';
      prev.disabled = i === 0;
      next.disabled = i === pages.length - 1;
      tocBtn.disabled = i === tocIdx;
      // the stack of unread pages gets thinner the further you read
      const left = Math.ceil((pages.length - 1 - i) / (pages.length - 1) * 4);
      edges.style.boxShadow = [1, 2, 3, 4].slice(0, left).map(n => `${n * 1.5}px ${n * 1.5}px 0 ${n % 2 ? '#e2d7c3' : '#cdbfa6'}`)
        .concat('0 18px 40px rgba(0,0,0,.45)').join(',');
      edges.style.visibility = i === pages.length - 1 ? 'hidden' : '';
    }

    // Start turning towards page `dest`. Forward: the current page lifts off and reveals `dest`.
    // Backward: `dest` comes back over the spine and covers the current page.
    function begin(dest) {
      const fwd = dest > current;
      const top = fwd ? current : dest, under = fwd ? dest : current;
      for (const k of [top, under]) pages[k].el.classList.add('on');
      for (const k of [top, under]) pages[k].el.classList.remove('idle');
      pages.forEach((p, k) => { if (k !== top && k !== under && p.el.classList.contains('on')) p.el.classList.add('idle'); });
      pages[under].el.style.zIndex = 1;
      pages[top].el.style.zIndex = 4;
      flip = { top: pages[top].el, under: pages[under].el, dest, fwd, theta: fwd ? 0 : 180, raf: 0 };
      draw(flip.theta);
    }

    // theta: 0 = top page flat on the right, 180 = turned over to the left of the spine.
    function draw(theta) {
      flip.theta = theta;
      const r = theta * Math.PI / 180;
      flip.top.style.transform = `rotateY(${(-theta).toFixed(2)}deg)`;
      frontShade(flip.top).style.opacity = (Math.min(1, theta / 90) * 0.75).toFixed(3);
      backShade(flip.top).style.opacity = (Math.min(1, (180 - theta) / 90) * 0.6).toFixed(3);
      frontShade(flip.under).style.opacity = ((1 - theta / 180) * 0.45).toFixed(3);
      cast.style.transform = `translateX(${Math.max(0, stack.clientWidth * Math.cos(r)).toFixed(1)}px)`;
      cast.style.opacity = theta < 90 ? Math.sin(r).toFixed(3) : 0;
    }

    const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const easeOut = t => 1 - Math.pow(1 - t, 3);
    function animateTo(target, ms, ease, done) {
      cancelAnimationFrame(flip.raf);
      const start = flip.theta, dist = target - start, t0 = performance.now();
      if (reduce.matches) ms = 0;
      const step = now => {
        const t = ms ? Math.min(1, (now - t0) / ms) : 1;
        draw(start + dist * ease(t));
        if (t < 1) flip.raf = requestAnimationFrame(step); else done();
      };
      flip.raf = requestAnimationFrame(step);
    }

    function goTo(i) {
      i = Math.max(0, Math.min(pages.length - 1, i));
      if (flip) settle(flip.dest); // tapping again while a page is turning: finish it at once
      if (i === current) return;
      begin(i);
      animateTo(flip.fwd ? 180 : 0, 520, easeInOut, () => settle(i));
    }

    // relative turns count from where the page is heading, so quick repeated taps each turn a page
    const turn = d => goTo((flip ? flip.dest : current) + d);
    prev.onclick = () => turn(-1);
    next.onclick = () => turn(1);
    tocBtn.onclick = () => goTo(tocIdx);

    // Drag to turn: the free edge of the page follows your finger; release to finish or let it fall back.
    let drag = null, swallowClick = false;
    book.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      if (flip && !drag) settle(flip.dest);
      drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, active: false, hist: [] };
    });
    book.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (!drag.active) {
        if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
        const dest = current + (dx < 0 ? 1 : -1);
        if (dest < 0 || dest >= pages.length) { drag = null; return; }
        drag.active = true;
        drag.x0 = e.clientX; // start from here so the page does not jump
        book.setPointerCapture(e.pointerId);
        book.classList.add('dragging');
        begin(dest);
      }
      const ddx = e.clientX - drag.x0, w = stack.clientWidth;
      drag.hist.push([e.timeStamp, e.clientX]);
      if (drag.hist.length > 5) drag.hist.shift();
      const edge = (flip.fwd ? w : -w) + ddx * 1.6;
      draw(Math.acos(Math.max(-1, Math.min(1, edge / w))) * 180 / Math.PI);
    });
    const release = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag; drag = null;
      if (!d.active) return;
      book.classList.remove('dragging');
      swallowClick = true; setTimeout(() => swallowClick = false, 0);
      const h = d.hist, [ta, xa] = h[0] || [0, 0], [tb, xb] = h[h.length - 1] || [1, 0];
      const v = (xb - xa) / Math.max(1, tb - ta); // px/ms, negative = towards the left
      const fwd = flip.fwd, th = flip.theta, from = current, dest = flip.dest;
      let commit = fwd ? (v < -0.3 || (v <= 0.3 && th > 65)) : (v > 0.3 || (v >= -0.3 && th < 115));
      if (e.type === 'pointercancel') commit = false;
      const target = commit === fwd ? 180 : 0;
      const ms = Math.max(160, Math.min(420, Math.abs(target - th) / 180 * 520 / Math.max(1, Math.abs(v))));
      animateTo(target, ms, easeOut, () => settle(commit ? dest : from));
    };
    book.addEventListener('dragstart', e => e.preventDefault());
    book.addEventListener('pointerup', release);
    book.addEventListener('pointercancel', release);

    // Tap: links go to their page, the outer edges of a page turn it (like an e-reader).
    book.addEventListener('click', e => {
      if (swallowClick) { e.stopPropagation(); e.preventDefault(); return; }
      const t = e.target.closest('[data-go]');
      if (t) return goTo(+t.dataset.go);
      if (e.target.closest('button, a, input') || String(getSelection())) return;
      const r = stack.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
      if (x > 0.68) turn(1);
      else if (x < 0.22) turn(-1);
    }, true);

    addEventListener('keydown', e => {
      if (search.classList.contains('open')) { if (e.key === 'Escape') closeSearch(); return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); turn(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); turn(-1); }
      else if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); }
    });

    // ---------- Search ----------
    const search = document.getElementById('search');
    const q = document.getElementById('q');
    const results = document.getElementById('results');
    let filter = null; // one filter at a time
    const index = items.map(b => ({ b, name: norm(b.naam), all: norm(`${b.nr} ${b.naam} ${b.abv || ''} ${b.tekst}`) }));

    function highlight(text, terms) {
      let out = esc(text);
      for (const t of terms) {
        if (!t) continue;
        const n = norm(text); const i = n.indexOf(t);
        if (i < 0) continue;
        // map normalised position back to the original (same length after NFD strip for Latin text)
        out = esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + t.length)) + '</mark>' + esc(text.slice(i + t.length));
        break;
      }
      return out;
    }

    function render() {
      const terms = norm(q.value.trim()).split(/\s+/).filter(Boolean);
      const list = index.filter(({ b, all }) => {
        if (!matches(b, filter)) return false;
        return terms.every(t => all.includes(t) || (t.length > 5 && all.includes(t.slice(0, -2))));
      }).map(r => {
        // rank: exact number > name starts with > name contains > description only
        const t = terms.join(' ');
        let score = 3;
        if (t && String(r.b.nr).toLowerCase() === t) score = 0;
        else if (t && r.name.startsWith(t)) score = 1;
        else if (terms.every(x => r.name.includes(x))) score = 2;
        return { ...r, score };
      }).sort((a, z) => a.score - z.score);

      if (!list.length) { results.innerHTML = `<li class="empty">Niets gevonden${q.value ? ` voor “${esc(q.value)}”` : ''}.</li>`; return; }
      results.innerHTML = list.map(({ b, score }) => {
        const thumb = b.type === 'wijn' ? `<span class="ph">🍷</span>` : `<img src="${img(b)}" alt="" />`;
        const meta = [b.type === 'wijn' ? 'Wijn' : 'Nr. ' + b.nr, b.vat && 'op tap', isNonAlc(b) && 'alcoholvrij', b.trappist && 'trappist', terms.length && score === 3 && 'gevonden in beschrijving'].filter(Boolean).join(' · ');
        return `<li><button data-go="${pageOf[b.nr]}">${thumb}<span><strong>${highlight(b.naam, terms)}</strong><span class="meta">${meta}</span></span><span class="pct">${esc(b.abv || '')}</span></button></li>`;
      }).join('');
    }

    function openSearch() { search.classList.add('open'); render(); setTimeout(() => q.focus(), 50); }
    function closeSearch() { search.classList.remove('open'); q.blur(); }
    document.getElementById('openSearch').onclick = openSearch;
    document.getElementById('closeSearch').onclick = closeSearch;
    search.addEventListener('click', e => {
      if (e.target === search) return closeSearch();
      const t = e.target.closest('[data-go]');
      if (t) { closeSearch(); goTo(+t.dataset.go); }
    });
    q.addEventListener('input', render);
    q.addEventListener('keydown', e => { if (e.key === 'Enter') { const first = results.querySelector('[data-go]'); if (first) first.click(); } });
    const FILTERS = [['nonalc', 'Alcoholvrij'], ['vat', 'Op tap'], ['wijn', 'Wijn/cava']];
    const matches = (b, f) => !f || (f === 'vat' ? b.vat : f === 'nonalc' ? isNonAlc(b) : b.type === 'wijn');
    document.querySelectorAll('[data-chips]').forEach(row => row.innerHTML = FILTERS.map(([f, l]) =>
      `<button class="chip" data-f="${f}" aria-pressed="false">${l}<span class="x" aria-hidden="true">✕</span></button>`).join(''));
    // one filter at a time, shared by the search panel and the contents page
    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === f));
      let shown = 0;
      document.querySelectorAll('#toc li').forEach(li => {
        const ok = !!matches(items.find(b => String(b.nr) === li.dataset.nr), f);
        li.hidden = !ok; shown += ok;
      });
      document.getElementById('tocEmpty').hidden = shown > 0;
      if (search.classList.contains('open')) render();
    }
    document.addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      e.stopPropagation();
      setFilter(filter === c.dataset.f ? null : c.dataset.f);
    }, true);
    setFilter(null);

    // ---------- Deep link (#12 opens beer 12, handy for a QR code per table) ----------
    function fromHash(animate) {
      const key = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      const i = Math.max(0, pages.findIndex(p => p.key.toLowerCase() === key));
      animate === true ? goTo(i) : settle(i);
    }
    addEventListener('hashchange', () => fromHash(true));
    fromHash();
  </script>
</body>
</html>
